<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071426">
<title>h2o browser</title>
<style>
:root{color-scheme:dark;--bg:#071426;--panel:#0d2038;--panel2:#132b48;--blue:#287ac5;--text:#edf5ff;--muted:#91a6bd;--border:#1c3654}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}button,input{font:inherit}button{cursor:pointer;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:9px 12px}button:hover{background:#1c3c61}header{background:var(--panel);border-bottom:1px solid var(--border);flex:none}.tabs{height:42px;display:flex;align-items:center;gap:6px;padding:5px 8px;overflow-x:auto}.tab{min-width:110px;max-width:210px;display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer}.tab.active{background:var(--panel2);border-color:var(--blue)}.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.close{padding:0 5px;border:0;background:transparent}.toolbar{display:flex;gap:6px;align-items:center;padding:8px}.address{flex:1;display:flex;min-width:60px;background:var(--bg);border:1px solid var(--border);border-radius:10px}.address input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);padding:11px}.address input::placeholder{color:var(--muted)}#content{flex:1;min-height:0;position:relative}#browser{width:100%;height:100%;border:0;background:white;display:none}#home{height:100%;overflow:auto;text-align:center;padding:clamp(70px,15vh,150px) 18px 40px}.logo{font-size:76px;font-weight:800;letter-spacing:-5px;color:#388fe8;margin-bottom:32px}.search{max-width:680px;margin:auto;display:flex;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:6px}.search input{flex:1;min-width:0;background:transparent;color:var(--text);border:0;outline:0;padding:13px}.search button{background:var(--blue);border:0;padding:12px 22px}.shortcuts{max-width:680px;margin:32px auto;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.shortcut{padding:15px 5px;background:var(--panel);border:1px solid var(--border);border-radius:12px}.shortcut div{font-size:25px;margin-bottom:8px}.shortcut small{font-size:12px}.hint{color:var(--muted);font-size:12px;margin-top:24px}#blocked{display:none;position:absolute;inset:0;background:var(--bg);padding:35px 20px;text-align:center;overflow:auto}#blocked h2{color:#388fe8}#blocked p{color:var(--muted);line-height:1.5;max-width:540px;margin:12px auto 20px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}@media(max-width:560px){.toolbar{gap:4px;padding:6px}.toolbar button{padding:9px 10px}.shortcuts{grid-template-columns:repeat(3,1fr)}.logo{font-size:64px}.tabs{height:40px}}
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <button onclick="goBack()" aria-label="Back">←</button>
    <button onclick="goForward()" aria-label="Forward">→</button>
    <button onclick="reloadPage()" aria-label="Reload">↻</button>
    <button onclick="goHome()" aria-label="Home">⌂</button>
    <div class="address"><input id="url" autocomplete="off" spellcheck="false" placeholder="Search Google or enter a website address" onkeydown="if(event.key==='Enter')navigate(this.value)"></div>
    <button onclick="openExternal()" aria-label="Open in new tab">↗</button>
    <button onclick="newTab()" aria-label="New tab">＋</button>
  </div>
</header>
<main id="content">
  <section id="home">
    <div class="logo">h2o</div>
    <div class="search"><input id="homeSearch" placeholder="Search the web with Google" onkeydown="if(event.key==='Enter')navigate(this.value)"><button onclick="navigate(document.getElementById('homeSearch').value)">Search</button></div>
    <div class="shortcuts">
      <button class="shortcut" onclick="navigate('https://lichess.org')"><div>♞</div><small>Lichess</small></button>
      <button class="shortcut" onclick="navigate('https://www.google.com')"><div>G</div><small>Google</small></button>
      <button class="shortcut" onclick="navigate('https://www.youtube.com')"><div>▶</div><small>YouTube</small></button>
      <button class="shortcut" onclick="navigate('https://www.wikipedia.org')"><div>W</div><small>Wikipedia</small></button>
      <button class="shortcut" onclick="navigate('https://www.reddit.com')"><div>r/</div><small>Reddit</small></button>
    </div>
    <div class="hint">h2o browser</div>
  </section>
  <iframe id="browser" title="Web page" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen; autoplay; clipboard-read; clipboard-write" allowfullscreen></iframe>
  <section id="blocked"><h2>This website won't open inside h2o</h2><p>Some websites block being displayed inside another website. You can still open the page in a normal browser tab.</p><div class="actions"><button onclick="openExternal()">Open website externally ↗</button><button onclick="goHome()">Back to h2o home</button></div></section>
</main>
<script>
let tabs=[],active=0;
const home=document.getElementById('home'),browser=document.getElementById('browser'),urlInput=document.getElementById('url'),blocked=document.getElementById('blocked');
function makeTab(){return{url:'',title:'New Tab',history:[],position:-1}}
function current(){return tabs[active]}
function renderTabs(){const box=document.getElementById('tabs');box.innerHTML='';tabs.forEach((tab,i)=>{const el=document.createElement('div');el.className='tab'+(i===active?' active':'');const name=document.createElement('span');name.textContent=tab.title;const close=document.createElement('button');close.className='close';close.textContent='×';close.setAttribute('aria-label','Close tab');close.onclick=e=>{e.stopPropagation();closeTab(i)};el.append(name,close);el.onclick=()=>switchTab(i);box.appendChild(el)})}
function displayPage(){const tab=current();renderTabs();urlInput.value=tab.url;blocked.style.display='none';if(!tab.url){home.style.display='block';browser.style.display='none';}else{home.style.display='none';browser.style.display='block';browser.src=tab.url}}
function newTab(){tabs.push(makeTab());active=tabs.length-1;displayPage()}
function switchTab(i){active=i;displayPage()}
function closeTab(i){if(tabs.length===1){tabs[0]=makeTab();active=0}else{tabs.splice(i,1);if(active>=tabs.length)active=tabs.length-1;else if(i<active)active--}displayPage()}
function normalize(input){input=input.trim();if(!input)return'';if(/^https?:\/\//i.test(input))return input;if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/i.test(input))return'https://'+input;return'https://www.google.com/search?q='+encodeURIComponent(input)}
function navigate(input){const destination=normalize(input);if(!destination)return;const tab=current();tab.history=tab.history.slice(0,tab.position+1);tab.history.push(destination);tab.position++;tab.url=destination;try{tab.title=new URL(destination).hostname}catch{tab.title='New Tab'}displayPage()}
function goBack(){const t=current();if(t.position>0){t.position--;t.url=t.history[t.position];displayPage()}else if(t.url)goHome()}
function goForward(){const t=current();if(t.position<t.history.length-1){t.position++;t.url=t.history[t.position];displayPage()}}
function reloadPage(){if(current().url){blocked.style.display='none';browser.src=current().url}}
function goHome(){current().url='';current().title='New Tab';displayPage()}
function openExternal(){if(current().url)window.open(current().url,'_blank','noopener,noreferrer')}
browser.addEventListener('error',()=>{blocked.style.display='block'});
tabs=[makeTab()];displayPage();
</script>
</body>
</html>
