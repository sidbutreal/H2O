<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071426">
<title>h2o</title>
<style>
:root{--bg:#071426;--panel:#0d2038;--panel2:#132b48;--blue:#287ac5;--text:#edf5ff;--muted:#91a6bd;--border:#1c3654}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;height:100vh;overflow:hidden}
button,input{font:inherit}
button{cursor:pointer;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:9px 13px}
button:hover{background:#1c3c61}
header{background:var(--panel);border-bottom:1px solid var(--border)}
.tabs{display:flex;align-items:center;gap:7px;padding:9px;overflow-x:auto}
.tab{min-width:105px;max-width:200px;display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer}
.tab.active{background:var(--panel2);border-color:var(--blue)}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.close{padding:2px 5px;border:0;background:transparent}
.toolbar{display:flex;gap:7px;align-items:center;padding:10px}
.address{flex:1;display:flex;background:var(--bg);border:1px solid var(--border);border-radius:12px;min-width:80px}
.address input{width:100%;border:0;outline:0;background:transparent;color:var(--text);padding:12px}
.address input::placeholder{color:var(--muted)}
#browser{width:100%;height:calc(100vh - 119px);border:0;background:white}
#home{height:calc(100vh - 119px);overflow-y:auto;text-align:center;padding:12vh 20px 40px}
.logo{font-size:76px;font-weight:800;letter-spacing:-5px;color:#388fe8;margin-bottom:35px}
.search{max-width:650px;margin:auto;display:flex;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:6px}
.search input{flex:1;min-width:0;background:transparent;color:var(--text);border:0;outline:0;padding:13px}
.search button{background:var(--blue);border:0;padding:12px 23px}
.shortcuts{max-width:650px;margin:35px auto;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.shortcut{padding:17px 5px;background:var(--panel);border:1px solid var(--border);border-radius:13px;color:var(--text)}
.shortcut div{font-size:27px;margin-bottom:9px}
.shortcut small{font-size:12px}
.bookmarks{max-width:650px;margin:20px auto;text-align:left;background:var(--panel);padding:18px;border-radius:13px}
.bookmarks h3{margin:0 0 12px}
.bookmarks button{margin:4px}
#blocked{display:none;position:absolute;inset:0;background:var(--bg);padding:45px 20px;text-align:center}
#blocked h2{color:#388fe8}
#blocked p{color:var(--muted);line-height:1.5}
@media(max-width:550px){.toolbar{gap:4px;padding:7px}.toolbar button{padding:9px}.shortcuts{grid-template-columns:repeat(3,1fr)}.logo{font-size:65px}#browser,#home{height:calc(100vh - 115px)}}
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <button onclick="goBack()" aria-label="Back">←</button>
    <button onclick="goForward()" aria-label="Forward">→</button>
    <button onclick="reloadPage()" aria-label="Reload">↻</button>
    <button onclick="goHome()" aria-label="Home">⌂</button>
    <div class="address"><input id="url" placeholder="Search or type a web address" onkeydown="if(event.key==='Enter')navigate(this.value)"></div>
    <button onclick="addBookmark()" aria-label="Bookmark">☆</button>
    <button onclick="openExternal()" aria-label="Open externally">↗</button>
    <button onclick="newTab()" aria-label="New tab">＋</button>
  </div>
</header>

<div id="home">
  <div class="logo">h2o</div>
  <div class="search">
    <input id="homeSearch" placeholder="Search the web..." onkeydown="if(event.key==='Enter')navigate(this.value)">
    <button onclick="navigate(document.getElementById('homeSearch').value)">Go</button>
  </div>
  <div class="shortcuts">
    <button class="shortcut" onclick="navigate('https://www.google.com')"><div>🌐</div><small>Google</small></button>
    <button class="shortcut" onclick="navigate('https://www.youtube.com')"><div>▶️</div><small>YouTube</small></button>
    <button class="shortcut" onclick="navigate('https://www.wikipedia.org')"><div>W</div><small>Wikipedia</small></button>
    <button class="shortcut" onclick="navigate('https://maps.google.com')"><div>📍</div><small>Maps</small></button>
    <button class="shortcut" onclick="navigate('https://mail.google.com')"><div>✉️</div><small>Gmail</small></button>
    <button class="shortcut" onclick="navigate('https://drive.google.com')"><div>📁</div><small>Drive</small></button>
    <button class="shortcut" onclick="navigate('https://photos.google.com')"><div>🖼️</div><small>Photos</small></button>
    <button class="shortcut" onclick="navigate('https://calendar.google.com')"><div>📅</div><small>Calendar</small></button>
    <button class="shortcut" onclick="navigate('https://translate.google.com')"><div>文</div><small>Translate</small></button>
    <button class="shortcut" onclick="navigate('https://chatgpt.com')"><div>💬</div><small>ChatGPT</small></button>
  </div>
  <div class="bookmarks"><h3>Bookmarks</h3><div id="bookmarkList"></div></div>
</div>

<iframe id="browser" title="H2O webpage" style="display:none" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="blocked">
  <h2>This site may not display here</h2>
  <p>Some websites block being shown inside another website. You can open this page in a new browser tab instead.</p>
  <button onclick="openExternal()">Open website externally</button>
</div>

<script>
let tabs=[];
let active=0;
const home=document.getElementById('home');
const browser=document.getElementById('browser');
const urlInput=document.getElementById('url');
const blocked=document.getElementById('blocked');

function makeTab(){return {url:'',title:'New Tab',history:[],position:-1};}
function current(){return tabs[active];}

function renderTabs(){
  const container=document.getElementById('tabs');
  container.innerHTML='';
  tabs.forEach((tab,i)=>{
    const el=document.createElement('div');
    el.className='tab'+(i===active?' active':'');
    const name=document.createElement('span');
    name.textContent=tab.title;
    const close=document.createElement('button');
    close.className='close';close.textContent='×';close.setAttribute('aria-label','Close tab');
    close.onclick=e=>{e.stopPropagation();closeTab(i);};
    el.append(name,close);
    el.onclick=()=>switchTab(i);
    container.appendChild(el);
  });
}

function displayPage(){
  const tab=current();
  renderTabs();
  urlInput.value=tab.url;
  blocked.style.display='none';
  if(!tab.url){home.style.display='block';browser.style.display='none';}
  else{home.style.display='none';browser.style.display='block';browser.src=tab.url;}
}
function newTab(){tabs.push(makeTab());active=tabs.length-1;displayPage();}
function switchTab(i){active=i;displayPage();}
function closeTab(i){
  if(tabs.length===1){tabs[0]=makeTab();active=0;}
  else{tabs.splice(i,1);if(active>=tabs.length)active=tabs.length-1;else if(i<active)active--;}
  displayPage();
}
function normalize(input){
  input=input.trim();
  if(!input)return '';
  if(/^https?:\/\//i.test(input))return input;
  if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/i.test(input))return 'https://'+input;
  return 'https://www.google.com/search?q='+encodeURIComponent(input);
}
function navigate(input){
  const destination=normalize(input);
  if(!destination)return;
  const tab=current();
  tab.history=tab.history.slice(0,tab.position+1);
  tab.history.push(destination);tab.position++;
  tab.url=destination;
  try{tab.title=new URL(destination).hostname;}catch{tab.title='New Tab';}
  displayPage();
}
function goBack(){
  const tab=current();
  if(tab.position>0){tab.position--;tab.url=tab.history[tab.position];displayPage();}
  else if(tab.url)goHome();
}
function goForward(){
  const tab=current();
  if(tab.position<tab.history.length-1){tab.position++;tab.url=tab.history[tab.position];displayPage();}
}
function reloadPage(){if(current().url)browser.src=current().url;}
function goHome(){current().url='';current().title='New Tab';displayPage();}
function openExternal(){if(current().url)window.open(current().url,'_blank','noopener,noreferrer');}

function getBookmarks(){
  try{return JSON.parse(localStorage.getItem('h2o-bookmarks')||'[]');}
  catch{return [];}
}
function addBookmark(){
  const url=current().url;
  if(!url)return;
  const list=getBookmarks();
  if(!list.includes(url)){list.push(url);localStorage.setItem('h2o-bookmarks',JSON.stringify(list));renderBookmarks();}
}
function renderBookmarks(){
  const list=document.getElementById('bookmarkList');
  list.innerHTML='';
  getBookmarks().forEach(url=>{
    const button=document.createElement('button');
    try{button.textContent=new URL(url).hostname;}catch{button.textContent=url;}
    button.onclick=()=>navigate(url);
    list.appendChild(button);
  });
}
browser.addEventListener('error',()=>{blocked.style.display='block';});
newTab();
renderBookmarks();
</script>
</body>
</html>
